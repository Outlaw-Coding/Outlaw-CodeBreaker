<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Outlaw CodeBreaker v7.0</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/vs-2015.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
  <div id="container">
    <div id="sidebar">
      <div class="sidebar-header">CHATS</div>
      <div class="chat-list" id="chat-list"></div>
      <button class="new-chat-btn" id="new-chat-btn">+ NEW CHAT</button>
    </div>
    
    <div id="terminal">
      <div id="output"></div>
      <div id="input-line">
        <span>$</span>
        <input type="text" id="cmd" autofocus autocomplete="off" placeholder="Ask AI to create or modify files..." />
      </div>
    </div>
    
    <div id="editor-panel">
      <div id="code-header">
        <span id="file-name">Select a file to view</span>
        <div>
          <button id="preview-btn">PREVIEW</button>
          <button id="download-btn">DOWNLOAD</button>
          <button id="download-all-btn">DOWNLOAD ALL</button>
        </div>
      </div>
      <pre id="code-view"><code></code></pre>
    </div>
  </div>

  <script src="ai.js"></script>
  <script src="main.js"></script>
</body>
</html>
